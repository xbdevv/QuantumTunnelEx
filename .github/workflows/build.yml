name: .NET

on:
  push:
  pull_request:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build -c Release --no-restore
    - name: Upload artifacts (dotnet)
      uses: actions/upload-artifact@v3
      with:
        name: QuantumTunnelEx-dotnet
        path: bin/Release/net10.0/*

    - name: Build (standalone)
      run: dotnet publish -c Release --self-contained -r win-x64 -p:PublishSingleFile=true
    - name: Prepare standalone release
      run: |
        mkdir release
        xcopy README.md release\
        xcopy bin\Release\net10.0\win-x64\publish\QuantumTunnelEx.exe release\
        7z a -tzip QuantumTunnelEx.zip .\release\*

    - name: Upload artifacts (standalone)
      uses: actions/upload-artifact@v3
      with:
        name: QuantumTunnel
        path: |
          release/*

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: QuantumTunnelEx.zip
